[package]
name = "ginrose"
version = "0.2.6"
edition = "2024"
description = "Roblox launcher for Linux, built around Rosemary"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"
cms = "0.2"
x509-cert = "0.2"
der = "0.7"
sha2 = "0.10"
plist = "1"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }

[profile.release]
lto = true
codegen-units = 1
